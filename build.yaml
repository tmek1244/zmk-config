# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: loss_left
  - board: nice_nano_v2
    shield: loss_right
  - board: nice_nano_v2
    shield: settings_reset
  # Dongle setup: flash loss_dongle on the dongle, loss_right_peripheral on the
  # right half, and the regular loss_left on the left half.
  - board: nice_nano_v2
    shield: loss_dongle
  - board: nice_nano_v2
    shield: loss_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: loss_right_peripheral-nice_nano_v2-zmk
